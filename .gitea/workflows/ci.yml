name: CI

# 只放 Gitea 侧：本仓库以 Gitea 为唯一源，GitHub 是只读镜像。
# 放在 .github/ 会被 Gitea 和 GitHub 各跑一遍，故只留 .gitea/。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 串行 runner 上必须配 cancel-in-progress：
# concurrency 用 false 时，只要有一个 run 卡住，这个组会被永久毒死。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  # runner 环境只给了单个 goproxy.cn，实测两次因它 TLS 超时而整挂 job：
  #   jciyuan-spider task 1084（16s 失败）、kongming-agent task 981。
  # 加兜底后 go 会自动顺次尝试：aliyun ~80ms / goproxy.cn ~140ms / goproxy.io ~600ms（均实测 3/3 可用）。
  GOPROXY: https://goproxy.cn,https://mirrors.aliyun.com/goproxy/,https://goproxy.io,direct
  GOSUMDB: sum.golang.google.cn

jobs:
  build:
    timeout-minutes: 60  # 注意：本机 act_runner v0.3.1 实测**不执行** job 级 timeout-minutes —— ci-smoke run#148 的 to job 声明 1 分钟、实际睡满 240 秒并成功。留着这行只为将来 runner 支持时生效；当前防挂死要靠步骤内显式超时（curl --max-time / timeout <秒> / pip --timeout）。
    name: Build / Vet / Test
    # 只有 NAS runner 配了 github_mirror；落到 1.4G 的 Pi 上连 action 都拉不下来（实测 task 1074 7s 即败）
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ github.server_url == 'https://github.com' }}

      - name: Build / vet / test
        run: |
          echo "arch: $(uname -m) / runner: $RUNNER_NAME"
          if [ ! -f go.mod ]; then
            echo "脚手架阶段：仓库还没有 go.mod，跳过 Go 构建。"
            echo "代码落地后这一步会自动开始 build / vet / test。"
            exit 0
          fi
          go mod download
          go build ./...
          go vet ./...
          go test ./...
